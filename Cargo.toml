[package]
name = "goonbox-dl"
version = "0.1.0"
edition = "2024"
# Edition 2024 needs this; stated here so cargo enforces the README's claim.
rust-version = "1.85"
description = "Desktop album downloader for goonbox.cr — a GUI and a CLI over one engine"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Prezcot/goonbox-dl"
# Not a crates.io crate; this stops an accidental `cargo publish`.
publish = false

[dependencies]
anyhow = "1"
async-trait = "0.1"
eframe = "0.33.3"
egui = "0.33.3"
futures-util = "0.3"
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time"] }
url = "2"

[dependencies.reqwest]
version = "0.12"
default-features = false
features = ["json", "stream", "rustls-tls"]
